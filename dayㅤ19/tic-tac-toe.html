<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>

  body {
    display: flex;
    overflow: hidden;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    margin: 0;
  }

  h1 {
    margin-bottom: 20px;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
  }

  #parent {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 10px;
    margin-bottom: 20px;
  }

  #parent div {
    background-color: #2c2c3c;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 50px;
    cursor: pointer;
    box-shadow: 0 5px 10px rgba(0,0,0,0.3);
    transition: transform 0.2s, background-color 0.2s;
  }

  #parent div:hover {
    transform: scale(1.1);
    background-color: #3d3d5c;
  }

  .win {
    animation: blink 0.6s infinite alternate;
    background-color: #ffd700 !important;
    color: #000;
  }

  @keyframes blink {
    from { transform: scale(1); }
    to { transform: scale(1.3); }
  }

  #resetBtn {
    padding: 12px 25px;
    cursor: pointer;
    font-size: 16px;
    background: #ff6b6b;
    color: #fff;
    border: none;
    border-radius: 10px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.3);
    transition: transform 0.2s, background 0.2s;
  }

  #resetBtn:hover {
    transform: scale(1.05);
    background: #ff8787;
  }
</style>
</head>
<body>

<h1>Tic-Tac-Toe</h1>
<div id="parent">
  <div></div><div></div><div></div>
  <div></div><div></div><div></div>
  <div></div><div></div><div></div>
</div>
<button id="resetBtn">Reset Game</button>

<script>
let divs = document.querySelectorAll('#parent div');
let resetBtn = document.getElementById('resetBtn');

let player1 = '❎';
let player2 = '🅾️';
let turn = 0;

let winningMoves = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

let player1Moves = [];
let player2Moves = [];

function checkWinner(moves) {
  return winningMoves.some(win =>
    win.every(pos => moves.includes(pos))
  );
}

function highlightWin(playerMoves) {
  winningMoves.forEach(win => {
    if (win.every(pos => playerMoves.includes(pos))) {
      win.forEach(pos => divs[pos].classList.add('win'));
    }
  });
}

function disableBoard() {
  divs.forEach(div => div.style.pointerEvents = "none");
}

function resetGame() {
  divs.forEach(div => {
    div.innerText = '';
    div.classList.remove('win');
    div.style.pointerEvents = 'auto';
  });
  player1Moves = [];
  player2Moves = [];
  turn = 0;
}

divs.forEach((div, index) => {
  div.addEventListener('click', () => {
    if (div.innerText) return;

    if (turn === 0) {
      div.innerText = player1;
      player1Moves.push(index);
      if (checkWinner(player1Moves)) {
        highlightWin(player1Moves);
        alert("❎ Player Wins!");
        disableBoard();
        return;
      }
      turn = 1;
    } else {
      div.innerText = player2;
      player2Moves.push(index);
      if (checkWinner(player2Moves)) {
        highlightWin(player2Moves);
        alert("🅾️ Player Wins!");
        disableBoard();
        return;
      }
      turn = 0;
    }

    if (player1Moves.length + player2Moves.length === 9) {
      alert("It's a Draw 🤝");
    }
  });
});

resetBtn.addEventListener('click', resetGame);
</script>

</body>
</html>
