<!-- Task 4: Card Component Styling
Objective: Use :root to style reusable components. -->

<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --section-margin: 10px;
      --section-padding: 15px;
    }

    .section {
      margin: var(--section-margin);
      padding: var(--section-padding);
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <p>Task 4: Card Component Styling
Objective: Use :root to style reusable components.</p>

<hr>

  <div class="section">Section 1</div>
  <div class="section">Section 2</div>

</body>
</html>
