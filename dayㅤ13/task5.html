<!-- Task 5: Simple Theme Using :root
Objective: Understand how :root helps in theming. -->

<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --font-size: 2vw;
      --bg-color: white;
      --text-color: black;
    }

    body {
      font-size: var(--font-size);
      background-color: var(--bg-color);
      color: var(--text-color);
    }
  </style>
</head>
<body>
  <p>ask 5: Simple Theme Using :root
Objective: Understand how :root helps in theming. </p>

<hr>

  <p>Font size scales automatically with screen size</p>

</body>
</html>
