<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexDash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <div class="sidebar">
        <h3>FlexDash</h3>
        <a href="#">Dashboard</a>
        <a href="#">Analytics</a>
        <a href="#">Users</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
    </div>

    <div class="main">

        <div class="topbar">
            <input type="text" placeholder="Search dashboard...">
        
            <div class="admin"> 👤 Admin</div>
        </div>

        <div class="content">
            <div class="cards">
                <div class="card">
                    <p>Users</p>
                    <h3>1,240</h3>
                </div>
                <div class="card">
                    <p>Revenue</p>
                    <h3>₹2.4L</h3>
                </div>
                <div class="card">
                    <p>Orders</p>
                    <h3>320</h3>
                </div>
            </div>

            <div class="cards">
                <div class="wide">
                    <p>Growth</p>
                    <h3>+18%</h3>
                </div>
                <div class="wide">
                    <p>Conversion</p>
                    <h3>5.4%</h3>
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
